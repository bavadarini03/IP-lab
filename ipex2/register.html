<!DOCTYPE html>
<html>
<head>
<title>Register</title>
</head>

<body>
<center>
<h1>ONLINE SHOPPING SYSTEM</h1>

<form action="login.html" style="width:350px; margin:auto; background:pink; padding:20px; border-radius:10px;">


<h2>Register</h2>

<label>Full Name</label><br>
<input type="text" placeholder="Enter Name" required><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter Email" required><br><br>

<label>Phone Number</label><br>
<input type="tel" placeholder="Enter Mobile Number" required><br><br>

<label>Address</label><br>
<textarea rows="4"></textarea><br><br>

<label>Password</label><br>
<input type="password" required><br><br>

<label>Confirm Password</label><br>
<input type="password" required><br><br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</form>
</center>
</body>
</html>
