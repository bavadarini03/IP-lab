<!DOCTYPE html>

<title>Order</title>

<body >

<h1 style="color:black;text-align:center;padding:15px;">
PLACE YOUR ORDER
</h1>

<center>

<a href="index.html" >Home</a>

<a href="products.html" >Products</a>

<a href="contact.html" >Contact</a>

<a href="login.html" >Logout</a>

<h2 style="text-align:center;color:green;">
Customer Details
</h2>

<form style="background-color:white;width:500px;margin:auto;padding:20px;border:2px solid black;">

<label><b>Customer Name</b></label><br><br>
<input type="text" placeholder="Enter Your Name"
style="width:100%;padding:8px;"><br><br>

<label><b>Email</b></label><br><br>
<input type="email" placeholder="Enter Email"
style="width:100%;padding:8px;"><br><br>

<label><b>Phone Number</b></label><br><br>
<input type="tel" placeholder="Enter Mobile Number"
style="width:100%;padding:8px;"><br><br>

<label><b>Select Brand</b></label><br><br>

<select style="width:100%;padding:8px;">

<option>Apple</option>

<option>Samsung</option>

<option>OnePlus</option>

<option>Redmi</option>

</select>

<br><br>

<label><b>Select Model</b></label><br><br>

<select style="width:100%;padding:8px;">

<option>iPhone 16</option>

<option>Samsung Galaxy S25</option>

<option>OnePlus 13</option>

<option>Redmi Note 14 Pro</option>

</select>

<br><br>

<label><b>Quantity</b></label><br><br>

<input type="number" min="1"
style="width:100%;padding:8px;">

<br><br>

<label><b>Payment Method</b></label><br><br>

<input type="radio" name="pay"> Cash on Delivery

<br>

<input type="radio" name="pay"> UPI

<br>

<input type="radio" name="pay"> Credit/Debit Card

<br><br>

<label><b>Delivery Address</b></label><br><br>

<textarea rows="5"
style="width:100%;"></textarea>

<br><br>

<center>

<input type="submit"
value="Place Order"
style="color:black;padding:10px 20px;border:none;">

<input type="reset"
value="Clear"
style="color:black;padding:10px 20px;border:none;">

</center>

</form>

<br>

<p style="text-align:center;color:blue;font-size:18px;">
Thank you for shopping with us!
</p>

</body>
</html>
