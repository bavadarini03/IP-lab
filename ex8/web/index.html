<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>

var title = new String("User Registration");
document.title = title.toUpperCase();

</script>

<style>

body{
    font-family:Arial;
    background:#e6e6e6;
    margin:0;
}

.container{
    width:900px;
    margin:30px auto;
    background:white;
    display:flex;
    border:1px solid gray;
}

.right{
    width:65%;
    padding:150px;
}

.right h2{
    text-align:center;
    color:white;
    background-color:#0066cc;
    padding:10px;
}

table{
    width:100%;
}

td{
    padding:8px;
}

label{
    font-weight:bold;
}

input,select,textarea{

    width:100%;
    padding:8px;
    margin-top:5px;

}

textarea{
    height:60px;
}

button{

    width:100%;
    padding:10px;
    background:#0066cc;
    color:white;
    border:none;
    font-size:16px;
    margin-top:15px;

}

button:hover{
    background:#004c99;
}

.error{
    color:red;
    font-size:13px;
}

#success{
    color:green;
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="right">

<h2>User Registration</h2>
<br><br>

<form id="userForm" action="register.jsp" method="post">

<table>

<tr>

<td>

<label>User Name *</label>

<input type="text" id="username" name="username"
placeholder="Enter your username">

<div class="error" id="usernameError"></div>

</td>

<td>

<label>Email *</label>

<input type="text" id="email" name="email"
placeholder="Enter your email address">

<div class="error" id="emailError"></div>

</td>

</tr>

<tr>

<td>

<label>Phone Number *</label>

<input type="text" id="phone" name="phone"
placeholder="Enter 10-digit mobile number">

<div class="error" id="phoneError"></div>

</td>

<td>

<label>Password *</label>

<input type="password" id="password" name="password"
placeholder="Enter your password">

<div class="error" id="passwordError"></div>

</td>

</tr>

<tr>

<td>

<label>Confirm Password *</label>

<input type="password" id="confirm" name="confirm"
placeholder="Re-enter your password">

<div class="error" id="confirmError"></div>

</td>

<td>

<label>Date of Birth *</label>

<input type="date" id="dob" name="dob">

<div class="error" id="dobError"></div>

</td>

</tr>

<tr>

<td>

<label>Gender *</label>

<select id="gender" name="gender">

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<div class="error" id="genderError"></div>

</td>

<td>

<label>Qualification *</label>

<select id="qualification" name="qualification">

<option value="">Select Qualification</option>

<option>10th</option>

<option>12th</option>

<option>B.E/B.Tech</option>

<option>B.Sc</option>

<option>BCA</option>

<option>M.E/M.Tech</option>

<option>MCA</option>

<option>MBA</option>

</select>

<div class="error" id="qualificationError"></div>

</td>

</tr>

<tr>

<td>

<label>College Name *</label>

<input type="text" id="college" name="college"
placeholder="Enter your college name">

<div class="error" id="collegeError"></div>

</td>

<td>

<label>City *</label>

<input type="text" id="city" name="city"
placeholder="Enter your city">

<div class="error" id="cityError"></div>

</td>

</tr>

<tr>

<td>

<label>State *</label>

<input type="text" id="state" name="state"
placeholder="Enter your state">

<div class="error" id="stateError"></div>

</td>

<td>

<label>Country *</label>

<input type="text" id="country" name="country"
placeholder="Enter your country">

<div class="error" id="countryError"></div>

</td>

</tr>

<tr>

<td>

<label>Pincode *</label>

<input type="text" id="pincode" name="pincode"
placeholder="Enter 6-digit pincode">

<div class="error" id="pincodeError"></div>

</td>

<td>

<label>Security Question *</label>

<select id="question" name="question">

<option value="">Select Question</option>

<option>What is your pet name?</option>

<option>What is your favourite color?</option>

<option>What is your birth place?</option>

<option>What is your favourite food?</option>

</select>

<div class="error" id="questionError"></div>

</td>

</tr>

<tr>

<td colspan="2">

<label>Security Answer *</label>

<input type="text" id="answer" name="answer"
placeholder="Enter your answer">

<div class="error" id="answerError"></div>

</td>

</tr>

<tr>

<td colspan="2">

<label>Address *</label>

<textarea id="address" name="address"
placeholder="Enter your complete address"></textarea>

<div class="error" id="addressError"></div>

</td>

</tr>

<tr>

<td colspan="2">

<input type="checkbox" id="agree" name="agree"
value="Yes" style="width:auto;">

I agree to the Terms & Conditions

<div class="error" id="agreeError"></div>

</td>

</tr>

<tr>

<td colspan="2">

<button type="submit">

Register

</button>

</td>

</tr>

</table>

<div id="success"></div>

</form>

</div>

</div>

<script>

document.getElementById("userForm").addEventListener("submit",function(e){

let valid=true;

document.querySelectorAll(".error").forEach(function(x){

x.innerHTML="";

});

document.getElementById("success").innerHTML="";


function check(id,msg){

let value=document.getElementById(id).value.trim();

if(value==""){

document.getElementById(id+"Error").innerHTML=msg;

valid=false;

}

return value;

}


var username=check("username","Enter Username");

var email=check("email","Enter Email");

var phone=check("phone","Enter Phone Number");

var password=check("password","Enter Password");

var confirm=check("confirm","Confirm Password");

check("dob","Select Date of Birth");

check("gender","Select Gender");

check("qualification","Select Qualification");

check("college","Enter College Name");

check("city","Enter City");

check("state","Enter State");

check("country","Enter Country");

var pincode=check("pincode","Enter Pincode");

check("question","Select Security Question");

check("answer","Enter Security Answer");

check("address","Enter Address");


/* Email Validation */

var emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(email!="" && !emailPattern.test(email))
{

document.getElementById("emailError").innerHTML="Invalid Email";

valid=false;

}


/* Phone Validation */

var phonePattern=/^[0-9]{10}$/;

if(phone!="" && !phonePattern.test(phone))
{

document.getElementById("phoneError").innerHTML=
"Enter 10 Digit Mobile Number";

valid=false;

}


/* Password Validation */

if(password!="" && password.length<6)
{

document.getElementById("passwordError").innerHTML=
"Password must contain at least 6 characters";

valid=false;

}


/* Confirm Password */

if(password!=confirm)
{

document.getElementById("confirmError").innerHTML=
"Passwords do not match";

valid=false;

}


/* Pincode Validation */

var pincodePattern=/^[0-9]{6}$/;

if(pincode!="" && !pincodePattern.test(pincode))
{

document.getElementById("pincodeError").innerHTML=
"Enter 6 Digit Pincode";

valid=false;

}


/* Terms and Conditions */

if(!document.getElementById("agree").checked)
{

document.getElementById("agreeError").innerHTML=
"Accept Terms & Conditions";

valid=false;

}


/* Stop form submission if validation fails */

if(!valid)
{

e.preventDefault();

}

});

</script>

</body>

</html>
